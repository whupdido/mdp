algo:
  port: 8000
yolo:
  port: 5001
  stream: true
  unwanted: [] # arrows/stop (36-40) are real Task 1 images -- do not filter them. 0 (bullseye/marker) stays reportable for A.5
  fail_threshold: 2 # 2 for task 1 if shift left, right during retry
  num_images: 2
  models:
    0:
      path: "server/best.pt"
      weight: 1.0
      mapping: "server/mapping.json"
      is_main: true
